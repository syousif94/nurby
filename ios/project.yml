# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` creates Nurby.xcodeproj.
name: Nurby
options:
  bundleIdPrefix: com.sammy
  deploymentTarget:
    iOS: "26.0"
targets:
  Nurby:
    type: application
    platform: iOS
    sources:
      - Nurby
    dependencies:
      - framework: NurbyCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.nurby
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nurby listens when you hold the mic so you can describe changes to your part."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Nurby transcribes speech on device to drive the agent."
